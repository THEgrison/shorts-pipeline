name: tiktok_default
description: Classic TikTok word-by-word captions, yellow highlight
is_default: true
config:
  font_name: Montserrat
  font_size: 72
  primary_color: "#FFFFFF"
  highlight_color: "#FFE566"
  outline_color: "#000000"
  outline_width: 4
  shadow: 2
  position: bottom_third
  max_words_per_line: 3
  animation: pop
  progress_bar: true
  progress_bar_color: "#FFE566"
  intro_path: null
  outro_path: null
  background_music_volume: 0.08
