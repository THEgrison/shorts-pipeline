[project]
name = "shorts-pipeline"
version = "0.1.0"
description = "Multi-agent pipeline: YouTube long-form → vertical shorts → multi-platform publishing"
readme = "README.md"
authors = [
    { name = "Shorts Pipeline", email = "dev@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "cryptography>=44.0.0",
    "python-multipart>=0.0.17",
    "jinja2>=3.1.4",
    "pyyaml>=6.0.2",
    "flower>=2.0.1",
]

[project.optional-dependencies]
analysis = [
    "yt-dlp>=2024.12.0",
    "faster-whisper>=1.1.0",
    "anthropic>=0.40.0",
    "scenedetect[opencv]>=0.6.4",
    "librosa>=0.10.2",
    "numpy>=2.1.0",
]
editing = [
    "opencv-python-headless>=4.10.0",
    "mediapipe>=0.10.18",
    "pillow>=11.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "types-PyYAML>=6.0.12",
    "types-redis>=4.6.0",
    "aiosqlite>=0.20.0",
]

[project.scripts]
shorts-pipeline = "shorts_pipeline.cli:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "types-PyYAML>=6.0.12",
    "types-redis>=4.6.0",
    "aiosqlite>=0.20.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["shorts_pipeline"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = []
mypy_path = "src"
packages = ["shorts_pipeline"]

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "flower.*",
    "yt_dlp.*",
    "faster_whisper.*",
    "cv2.*",
    "mediapipe.*",
    "scenedetect.*",
    "librosa.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["shorts_pipeline"]
branch = true
